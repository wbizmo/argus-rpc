name: Normalize npm lockfile

on:
  push:
    branches:
      - feat/argus-v2-100-commit-upgrade
    paths:
      - package-lock.json
      - .github/workflows/normalize-lockfile.yml

permissions:
  contents: write

concurrency:
  group: normalize-argus-lockfile
  cancel-in-progress: true

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/argus-v2-100-commit-upgrade

      - name: Normalize lockfile metadata and registry URLs
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          lock.name = 'argus-rpc';
          lock.version = '2.0.0';
          if (lock.packages?.['']) {
            lock.packages[''].name = 'argus-rpc';
            lock.packages[''].version = '2.0.0';
            lock.packages[''].license = 'SEE LICENSE IN LICENSE';
          }
          let output = JSON.stringify(lock, null, 2) + '\n';
          output = output.replaceAll(
            'http://package-firewall.replit.local/npm/',
            'https://registry.npmjs.org/'
          );
          fs.writeFileSync('package-lock.json', output);
          NODE

      - name: Commit normalized lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: normalize npm lockfile for the public registry"
          git push origin HEAD:feat/argus-v2-100-commit-upgrade
