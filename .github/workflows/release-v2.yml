name: Release v2

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Verify release version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "2.1.0" ]; then
            echo "Skipping: verified main is version $VERSION, not 2.1.0."
            exit 0
          fi

      - name: Create v2.1.0 tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"

          if [ "$TAG" != "v2.1.0" ]; then
            exit 0
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; release is idempotently complete."
            exit 0
          fi

          cat > /tmp/argus-v21-release.md <<'NOTES'
          Argus RPC v2.1.0 is an engineering-hardening release for the v2 runtime. It keeps the Argus v2 wire protocol intact while removing accidental quadratic hot-path work, tightening cancellation/state-machine correctness, and adding reproducible complexity evidence.

          ## Highlights

          - message-ID allocation now checks the live pending map directly instead of copying every pending ID into a new Set per request
          - chunk buffering, serialized socket writes, server limiter queues and pool waiters no longer rely on repeated front-of-array removal in their hot paths
          - queued server calls observe cancellation before execution and release queue capacity correctly
          - retry backoff is abort-aware, so cancelled calls do not wait for unrelated sleep intervals
          - RPC calls and pings now enforce the response type they are allowed to receive
          - failed server binds clean up listen state so a later listen attempt can succeed
          - circuit-breaker half-open configuration and concurrent probe races are hardened
          - encoder/decoder paths reuse derived method lengths, normalized limits and parsed headers instead of repeating work
          - per-frame message-type and remote-status validation avoid repeated enum enumeration
          - server method-count statistics use constant-time registry size
          - non-loopback plaintext binds remain refused by default unless an external trusted transport boundary is explicitly acknowledged
          - dedicated v2.1 hot-path benchmark and machine-readable RESULT_JSON output
          - deterministic structural complexity regression tests guard against reintroducing the removed O(n²)/allocation patterns
          - zero runtime dependencies

          ## Verification

          The release is created only after the exact main-branch commit passes CI.

          The v2.1 release checkpoint contains 156 tests across 39 files. CI validates Node 20, 22 and 24 with a clean install, strict TypeScript typecheck, the full unit/integration/adversarial test suite and package build. Node 22 additionally runs `npm pack --dry-run` and the v2.1 hot-path benchmark smoke.

          ## Compatibility

          Argus v2.1.0 is wire-compatible with v2.0.0. This release does not increment the Argus wire protocol version and does not require a v2 wire migration.

          The connection-pool least-loaded scan intentionally remains linear because the pool is small and bounded by design; v2.1 avoids adding a heap where the extra data-structure complexity would not pay for itself.

          ## Performance claims

          v2.1 removes known accidental quadratic behavior from transport/scheduling hot paths, but the release does not advertise a universal throughput multiplier. `npm run bench:v2.1` records commit, runtime, CPU, workload and operation-rate data, while CI gates deterministic structural invariants rather than flaky wall-clock thresholds.

          See `CHANGELOG.md`, `README.md`, `docs/BENCHMARKS.md`, and `docs/ENGINEERING_INVARIANTS.md` for the full engineering record.
          NOTES

          gh release create "$TAG" \
            --target "$VERIFIED_SHA" \
            --title "Argus RPC v2.1.0 — Hot-Path Efficiency & State-Machine Hardening" \
            --notes-file /tmp/argus-v21-release.md
